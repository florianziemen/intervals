<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <!-- GitHub social preview. Render to docs/social-preview.png at 1280x640 in a browser (needs ../wallaby.svg, ../zombie.svg). -->
  <style>
    text { font-family: -apple-system, 'SF Pro Display', system-ui, sans-serif; }
    .title { font-size: 132px; font-weight: 800; letter-spacing: -4px; fill: #fff; }
    .tag { font-size: 40px; font-weight: 600; fill: #fff; }
    .chip rect { fill: #f3e25a; }
    .chip text { font-size: 22px; font-weight: 700; fill: #1d1c0e; text-anchor: middle; }
    .story { font-size: 34px; font-weight: 600; fill: #f3e25a; }
  </style>
  <rect width="1280" height="640" fill="#2b3fe0" />
  <rect y="520" width="1280" height="120" fill="#151a22" />

  <text class="title" x="92" y="262">Wally</text>
  <text class="tag" x="96" y="348">HIIT timer and workout log</text>
  <text class="tag" x="96" y="398">for your phone</text>

  <g class="chip">
    <rect x="96" y="446" width="171" height="46" rx="23" />
    <text x="181.5" y="477">Works offline</text>
  </g>
  <g class="chip">
    <rect x="279" y="446" width="154" height="46" rx="23" />
    <text x="356" y="477">No tracking</text>
  </g>
  <g class="chip">
    <rect x="445" y="446" width="248" height="46" rx="23" />
    <text x="569" y="477">Data stays on device</text>
  </g>

  <text class="story" x="96" y="592">Train every day to save Wally from the zombies</text>

  <!-- zombie reaching right, Wally, zombie reaching left -->
  <image href="../zombie.svg" x="680" y="329" width="165" height="200" />
  <image href="../wallaby.svg" x="790" y="100" width="327" height="440" />
  <image href="../zombie.svg" x="0" y="0" width="190" height="230" transform="translate(1255 301) scale(-1 1)" />
</svg>
